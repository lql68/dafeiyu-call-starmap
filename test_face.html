<!doctype html><meta charset="utf-8">
<style>
body{margin:0;background:#0a1220;display:flex;align-items:center;justify-content:center;height:100vh}
.wrap{position:relative;height:96vh;aspect-ratio:543/598}
.wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.fx{position:absolute;left:0;top:0;width:100%;height:100%}
.eye{position:absolute;width:10.8%;height:11.2%;left:34.0%;top:40.1%;
 transform:translate(-50%,-50%);
 background:radial-gradient(ellipse at 50% 54%, #feece9 0 48%, #fde1da 68%, rgba(252,216,210,.55) 84%, rgba(252,216,210,0) 100%);
 border-radius:50%;}
.eye.r{left:52.2%;top:40.0%}
.eye::after{content:"";position:absolute;left:7%;right:7%;top:48%;height:13%;
 border-radius:50%/70%;
 background:linear-gradient(90deg,rgba(74,58,78,0) 0%,#453445 16%,#453445 84%,rgba(74,58,78,0) 100%);opacity:.92}
.mouth-cover{position:absolute;left:42.7%;top:45.7%;width:6.4%;height:5.8%;
 transform:translate(-50%,-50%);
 background:radial-gradient(ellipse at 50% 50%, #fdeee3 0 46%, #fdeade 64%, rgba(253,234,222,.62) 80%, rgba(253,234,222,0) 96%);
 border-radius:50%;filter:blur(.55px)}
.mouth-cover::after{content:"";position:absolute;left:28%;right:28%;top:42%;height:15%;
 border-radius:0 0 50% 50% / 0 0 100% 100%;
 background:linear-gradient(90deg,rgba(176,116,124,0) 0%,#b0747c 22%,#b0747c 78%,rgba(176,116,124,0) 100%);opacity:.85}
</style>
<div class="wrap">
 <img src="chibi/chibi.png">
 <div class="fx">
  <div class="eye l"></div><div class="eye r"></div>
  <div class="mouth-cover"></div>
 </div>
</div>
