<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Black Hole</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var cv  = document.getElementById('c');
  var ctx = cv.getContext('2d', { alpha:false });

  var W = 0, H = 0, CX = 0, CY = 0, DPR = 1, SCALE = 1;

  /* ── 尺度与物理常数（归一化：事件视界半径 = 1）──────────────── */
  var RS      = 1.0;      // 事件视界
  var R_IN    = 1.55;     // 盘内缘（最内稳定圆轨道附近）
  var R_OUT   = 10.0;     // 盘外缘
  var INC     = 0.62;     // 盘面对观察者的倾角（0 = 正对，越大越像斜着看）
  var FOV     = 7.5;      // 透视焦距（太大像鱼眼，太小没立体感）
  var KEPLER  = 2.1;      // 开普勒常量：ω = KEPLER / r^1.5

  /* ── 粒子 ──────────────────────────────────────────────────── */
  var NP_DISK  = 2600;
  var NP_JET   = 260;
  var NP_DUST  = 0;          /* 只留盘粒子和喷流 */
  var P = [];

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function spawnDisk(p, atOuter) {
    p.kind = 0;
    // 外圈密、内圈稀（面积加权），内缘附近更亮更热
    var u = Math.random();
    p.r = atOuter ? rnd(R_OUT * 0.80, R_OUT)
                  : R_IN + Math.pow(u, 1.9) * (R_OUT - R_IN);
    p.th = Math.random() * Math.PI * 2;
    p.vy = rnd(-0.045, 0.045);              // 盘有一点厚度
    p.jit = rnd(0.85, 1.15);                // 每颗粒子的角速度抖动
    p.life = 1;
    p.w = rnd(0.55, 1.5);                   // 视觉权重
  }

  function spawnJet(p, top) {
    p.kind = 1;
    p.r = rnd(0.35, 1.05);                  // 从极区附近射出
    p.th = Math.random() * Math.PI * 2;
    p.side = top ? -1 : 1;
    p.dist = rnd(0, 1.2);                   // 已喷出多远
    p.v  = rnd(6.5, 16.0);                  // 喷流速度（远快于轨道）
    p.spread = rnd(0.05, 0.30);
    p.life = rnd(0.35, 1.0);
    p.w = rnd(0.5, 1.2);
  }

  function spawnDust(p) {
    p.kind = 2;
    p.r  = rnd(6, 30);
    p.th = Math.random() * Math.PI * 2;
    p.vy = rnd(-6, 6);
    p.w  = rnd(0.25, 0.9);
    p.life = 1;
  }

  for (var i = 0; i < NP_DISK; i++) { var a = {}; spawnDisk(a, false); P.push(a); }
  for (var j = 0; j < NP_JET;  j++) { var b = {}; spawnJet(b, Math.random() < 0.5); P.push(b); }
  for (var k = 0; k < NP_DUST; k++) { var d = {}; spawnDust(d); P.push(d); }

  /* 吸积盘纹理：角向湍流，用来铺一层底，粒子叠在上面 */
  var DISK_TEX = (function () {
    var S = 512, cc = S / 2;
    var c = document.createElement('canvas'); c.width = c.height = S;
    var g = c.getContext('2d');
    var N = 96, cg = g.createConicGradient(0, cc, cc);
    for (var i = 0; i <= N; i++) {
      var ang = (i / N) * Math.PI * 2;
      var v = 0.5 + 0.5 * (Math.sin(ang * 5 + 0.7) * 0.5 +
                           Math.sin(ang * 11 + 2.1) * 0.3 +
                           Math.sin(ang * 23 + 4.4) * 0.2);
      v = 0.20 + 0.80 * v;
      cg.addColorStop(Math.min(1, i / N),
        'rgba(255,' + Math.round(120 + v * 90) + ',' + Math.round(46 + v * 54) + ',' +
        (0.10 + v * 0.62).toFixed(3) + ')');
    }
    g.fillStyle = cg; g.fillRect(0, 0, S, S);

    g.globalCompositeOperation = 'destination-in';
    var rg = g.createRadialGradient(cc, cc, S * 0.09, cc, cc, S * 0.50);
    rg.addColorStop(0.00, 'rgba(0,0,0,0)');
    rg.addColorStop(0.20, 'rgba(0,0,0,1)');
    rg.addColorStop(0.72, 'rgba(0,0,0,1)');
    rg.addColorStop(1.00, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(0, 0, S, S);

    g.globalCompositeOperation = 'source-atop';
    var warm = g.createRadialGradient(cc, cc, S * 0.09, cc, cc, S * 0.50);
    warm.addColorStop(0.00, 'rgba(255,252,244,0.92)');
    warm.addColorStop(0.26, 'rgba(255,214,164,0.62)');
    warm.addColorStop(0.60, 'rgba(240,138,64,0.20)');
    warm.addColorStop(1.00, 'rgba(170,60,26,0)');
    g.fillStyle = warm; g.fillRect(0, 0, S, S);
    g.globalCompositeOperation = 'source-over';

    var c2 = document.createElement('canvas'); c2.width = c2.height = S;
    var g2 = c2.getContext('2d');
    g2.filter = 'blur(4px)';
    g2.drawImage(c, 0, 0);
    return c2;
  })();

  /* bloom 用的低分辨率画布 */
  var BW = 0, BH = 0;
  var bloom = document.createElement('canvas');
  var bctx = bloom.getContext('2d');

  function resize() {
    DPR = Math.min(1.6, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W * 0.5; CY = H * 0.5;
    /* 黑洞在屏幕上占多大：让它成为绝对主体 */
    SCALE = Math.min(W, H) * 0.062;

    BW = Math.round(W * 0.28); BH = Math.round(H * 0.28);
    bloom.width = BW; bloom.height = BH;
  }
  resize();
  window.addEventListener('resize', resize);

  /* 温度色阶：内圈白热 → 中段橙 → 外圈暗红 */
  function tempColor(t, a) {
    // t: 0 内圈 .. 1 外圈
    var r, g, b;
    if (t < 0.32) {
      var u = t / 0.32;
      r = 255; g = 252 - u * 62; b = 240 - u * 168;   // 白 → 金
    } else if (t < 0.68) {
      var v = (t - 0.32) / 0.36;
      r = 255; g = 190 - v * 92; b = 72 - v * 40;     // 金 → 橙红
    } else {
      var w = (t - 0.68) / 0.32;
      r = 255 - w * 118; g = 98 - w * 56; b = 32 - w * 18; // 橙红 → 暗红
    }
    return 'rgba(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ',' + a.toFixed(3) + ')';
  }

  var lastT = 0, spin = 0;

  function frame(tms) {
    var dt = (tms - lastT) / 1000;
    if (!(dt > 0) || dt > 0.05) dt = 0.016;
    lastT = tms;
    spin += dt;

    /* ── 1. 背景：半透明覆盖做运动模糊（拖影靠它累积） ───────── */
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(1,2,5,0.34)';
    ctx.fillRect(0, 0, W, H);


    /* ── 2. 吸积盘底纹（会转）─────────────────────────────── */
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(-0.18);
    ctx.scale(1, Math.cos(INC));
    ctx.rotate(spin * 0.16);
    var dsz = SCALE * R_OUT * 2.02;
    ctx.globalAlpha = 0.06;
    ctx.drawImage(DISK_TEX, -dsz * 0.5, -dsz * 0.5, dsz, dsz);
    ctx.globalAlpha = 1;
    ctx.restore();

    /* ── 3. 物理更新 + 投影 ─────────────────────────────────── */
    var list = [];
    var cosI = Math.cos(INC), sinI = Math.sin(INC);

    for (var pi = 0; pi < P.length; pi++) {
      var p = P[pi];

      if (p.kind === 0) {
        /* 盘粒子：开普勒角速度 + 向内螺旋 */
        var w = (KEPLER / Math.pow(p.r, 1.5)) * p.jit;
        p.th += w * dt;
        /* 越靠内落越快 —— 接近视界时明显加速 */
        p.r -= (3.2 / (p.r * p.r) + 0.02) * dt;
        if (p.r < RS * 1.06) { spawnDisk(p, true); continue; }

      } else if (p.kind === 1) {
        /* 极区喷流：沿自转轴向外，边飞边散 */
        p.dist += p.v * dt;
        p.v *= (1 + 0.55 * dt);                 // 持续加速
        p.life -= dt * 0.22;
        if (p.life <= 0 || p.dist > 13) { spawnJet(p, p.side < 0); continue; }

      } else {
        p.th += 0.02 * dt;
        p.r -= 0.25 * dt;
        if (p.r < 1.4) { spawnDust(p); }
      }

      var x, y, z, spd;

      if (p.kind === 1) {
        /* 喷流：屏幕坐标直接在盘坐标系外算（沿 y 轴） */
        var dstep = p.dist;
        x = Math.cos(p.th) * p.spread * dstep * 0.42;
        y = p.side * (dstep * 1.0 + 1.2);
        z = Math.sin(p.th) * p.spread * dstep * 0.30;
        spd = p.v;

      } else {
        var cr = Math.cos(p.th) * p.r;
        var cz = Math.sin(p.th) * p.r;
        var cy2 = (p.kind === 2) ? p.vy * 0.6 : p.vy;
        x = cr;
        y = cz * cosI + cy2;      /* 屏幕上 y 被压缩 cos(INC)，INC=0 时是正圆 */
        z = cz * sinI;            /* 深度差用 sin(INC) */
        spd = (KEPLER / Math.pow(p.r, 1.5)) * p.r * p.jit;   // 切向线速度
      }

      var persp = FOV / (FOV + z);
      if (!isFinite(persp) || persp <= 0.05) continue;

      var sx = CX + x * persp * SCALE;
      var sy = CY + y * persp * SCALE;

      if (sx < -260 || sx > W + 260 || sy < -260 || sy > H + 260) continue;

      list.push({
        sx: sx, sy: sy, z: z, spd: spd, persp: persp,
        kind: p.kind, r: p.r, life: p.life, w: p.w, th: p.th
      });
    }

    /* 深度排序：后面的先画，前半圈盖在前景 */
    list.sort(function (A, B) { return B.z - A.z; });

    window.__D = { n: list.length, W: W, H: H, SCALE: SCALE,
                   s0: list[0] ? [Math.round(list[0].sx), Math.round(list[0].sy), +list[0].z.toFixed(2)] : null,
                   sMid: list[Math.floor(list.length/2)] ? [Math.round(list[Math.floor(list.length/2)].sx), Math.round(list[Math.floor(list.length/2)].sy)] : null,
                   R0: SCALE * RS };

    /* ── 4. 先画黑洞后面的粒子 ─────────────────────────────── */
    drawParticles(list, -1e9, 0);

    /* ── 5. 黑洞本体 ────────────────────────────────────────── */
    var R0 = SCALE * RS;                       // 视界在屏幕上的半径

    /* 外圈引力辉光 */
    var g0 = ctx.createRadialGradient(CX, CY, R0 * 1.1, CX, CY, R0 * 9);
    g0.addColorStop(0.00, 'rgba(255,150,70,0.055)');
    g0.addColorStop(0.35, 'rgba(226,110,54,0.022)');
    g0.addColorStop(1.00, 'rgba(150,60,30,0)');
    ctx.fillStyle = g0;
    ctx.beginPath(); ctx.arc(CX, CY, R0 * 9, 0, 6.2832); ctx.fill();

    /* 光子环：贴着阴影，最亮 */
    ctx.save();
    ctx.translate(CX, CY);
    ctx.scale(1, 1);
    var gp = ctx.createRadialGradient(0, 0, R0 * 0.92, 0, 0, R0 * 1.45);
    gp.addColorStop(0.00, 'rgba(255,253,248,0.88)');
    gp.addColorStop(0.30, 'rgba(255,206,142,0.38)');
    gp.addColorStop(0.66, 'rgba(246,140,62,0.09)');
    gp.addColorStop(1.00, 'rgba(230,110,40,0)');
    ctx.fillStyle = gp;
    ctx.beginPath(); ctx.arc(0, 0, R0 * 1.45, 0, 6.2832); ctx.fill();
    ctx.restore();

    /* 透镜抬起的背面弧（盘远侧被引力拉到上方） */
    ctx.save();
    ctx.translate(CX, CY);
    ctx.beginPath();
    ctx.arc(0, -R0 * 0.22, R0 * 0.92, Math.PI * 1.06, Math.PI * 1.94);
    ctx.strokeStyle = 'rgba(255,222,180,0.60)';
    ctx.lineWidth = Math.max(1.4, R0 * 0.09);
    ctx.stroke();
    ctx.restore();

    /* 阴影 */
    ctx.beginPath(); ctx.arc(CX, CY, R0 * 0.92, 0, 6.2832);
    ctx.fillStyle = '#000';
    ctx.fill();

    /* ── 6. 再画前半圈粒子 ─────────────────────────────────── */
    drawParticles(list, 0, 1e9);

    /* ── 6.5 暗角：把边缘压下去，视线只剩中心 ─────────────── */
    var vg = ctx.createRadialGradient(
      CX, CY, Math.min(W, H) * 0.30,
      CX, CY, Math.max(W, H) * 0.70);
    vg.addColorStop(0.00, 'rgba(0,0,0,0)');
    vg.addColorStop(0.55, 'rgba(0,0,0,0.22)');
    vg.addColorStop(1.00, 'rgba(0,0,0,0.62)');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    /* ── 7. 泛光：整帧缩小 + 模糊，再 lighter 叠回来 ───────── */
    bctx.globalCompositeOperation = 'source-over';
    bctx.clearRect(0, 0, BW, BH);
    bctx.filter = 'blur(5px)';
    bctx.drawImage(cv, 0, 0, BW, BH);
    bctx.filter = 'none';

    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.12;
    ctx.drawImage(bloom, 0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(frame);
  }

  /* 画一批粒子（z 在这个区间内的），带速度方向拖尾 */
  function drawParticles(list, zlo, zhi) {
    ctx.globalCompositeOperation = 'lighter';

    for (var i = 0; i < list.length; i++) {
      var q = list[i];
      if (q.z < zlo || q.z >= zhi) continue;

      if (q.kind === 1) {
        /* 喷流：蓝白，越远越淡 */
        var lf = Math.max(0, Math.min(1, q.life));
        var aa = (0.22 * lf * Math.min(1, q.persp * 1.3)).toFixed(3);
        var len = Math.min(30, q.spd * 0.75) * q.persp;
        ctx.strokeStyle = 'rgba(176,214,255,' + aa + ')';
        ctx.lineWidth = Math.max(0.6, 1.5 * q.persp * q.w);
        ctx.beginPath();
        ctx.moveTo(q.sx, q.sy);
        ctx.lineTo(q.sx - (q.sx - CX) * 0.045 * len * 0.06,
                   q.sy - Math.sign(q.sy - CY) * len);
        ctx.stroke();
        continue;
      }

      if (q.kind === 2) {
        ctx.fillStyle = 'rgba(190,206,232,' + (0.20 * q.w).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(q.sx, q.sy, 0.9 * q.persp, 0, 6.2832);
        ctx.fill();
        continue;
      }

      /* 盘粒子 */
      var tt = Math.max(0, Math.min(1, (q.r - R_IN) / (R_OUT - R_IN)));
      var near = 1 - tt;
      var alpha = (0.09 + 0.42 * near * near) * Math.min(1.25, q.persp);
      if (q.r < R_IN * 1.35) alpha *= 1.35;            // 内缘炽亮

      var col = tempColor(tt, Math.min(0.95, alpha));

      /* 运动模糊：沿切向拉一条渐隐的线段，速度越快越长 */
      var blurLen = Math.min(13, q.spd * 1.3) * q.persp;
      var tx = -Math.sin(q.th), ty = Math.cos(q.th) * Math.cos(INC);   /* cosI 是 frame() 的局部变量，这里不能直接用 */
      var tn = Math.hypot(tx, ty) || 1;
      tx /= tn; ty /= tn;

      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(0.5, (0.5 + 0.9 * near) * q.persp * q.w);
      ctx.beginPath();
      ctx.moveTo(q.sx, q.sy);
      ctx.lineTo(q.sx - tx * blurLen, q.sy - ty * blurLen);
      ctx.stroke();

      /* 粒子本体：内圈更实 */
      if (near > 0.45 || q.persp > 1.0) {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(q.sx, q.sy, Math.max(0.5, (0.6 + 1.4 * near) * q.persp * q.w), 0, 6.2832);
        ctx.fill();
      }
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  requestAnimationFrame(function (t) {
    lastT = t;
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
