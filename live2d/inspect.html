<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大肥鱼 drawable 巡检</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220;color:#cfe6f5;
    font:11px/1.35 ui-monospace,Consolas,monospace;overflow:hidden}
  #out{position:absolute;inset:0;padding:8px;white-space:pre;column-count:3;column-gap:14px}
  canvas{display:none}
</style>
</head>
<body>
<div id="out">初始化…</div>
<canvas id="c"></canvas>
<script src="lib/live2dcubismcore.min.js"></script>
<script src="lib/pixi.min.js"></script>
<script src="lib/cubism4.min.js"></script>
<script>
const out = s => { document.getElementById('out').textContent = s; };
window.onerror = (m, s, l) => out('JS 错误: ' + m + ' @' + s + ':' + l);
(async () => {
  try {
    const app = new PIXI.Application({view: document.getElementById('c'), width: 100, height: 100, backgroundAlpha: 0});
    const model = await PIXI.live2d.Live2DModel.from('model/大肥鱼/大肥鱼.model3.json', {autoInteract: false});
    app.stage.addChild(model);
    model.scale.set(0.02);
    await new Promise(r => setTimeout(r, 800));

    const mm = model.internalModel.coreModel;
    const mo = mm._model;
    const d = mo.drawables;
    const W = mo.canvasinfo.CanvasWidth, H = mo.canvasinfo.CanvasHeight;
    const parts = mo.parts;
    const lines = [];
    lines.push(`canvas ${Math.round(W)}x${Math.round(H)}  drawables=${mm.getDrawableCount()}  parts=${parts.ids.length}`);
    lines.push('--- 小尺寸且可见的 drawable（按面积升序，前 60）---');
    const rows = [];
    for (let i = 0; i < mm.getDrawableCount(); i++) {
      const op = d.opacities[i];
      if (op < 0.03) continue;
      const vc = d.vertexCounts[i], vp = d.vertexPositions[i];
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (let k = 0; k < vc; k++) {
        const x = vp[k * 2], y = vp[k * 2 + 1];
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      const w = (x1 - x0) / W, h = (y1 - y0) / H;
      if (w <= 0 || h <= 0) continue;
      rows.push({i, id: d.ids[i], op: +op.toFixed(2),
        cx: +((x0 + x1) / 2 / W).toFixed(3), cy: +((y0 + y1) / 2 / H).toFixed(3),
        w: +w.toFixed(3), h: +h.toFixed(3), area: +(w * h).toFixed(5)});
    }
    rows.sort((a, b) => a.area - b.area);
    for (const r of rows.slice(0, 60)) {
      lines.push(`${String(r.i).padStart(3)} ${r.id.padEnd(22)} op=${r.op} c=(${r.cx},${r.cy}) ${r.w}x${r.h}`);
    }
    lines.push('--- 可见 parts ---');
    const pl = [];
    for (let i = 0; i < parts.ids.length; i++) {
      if (parts.opacities[i] > 0.03) pl.push(`${i}:${parts.ids[i]}`);
    }
    lines.push(pl.join(' '));
    out(lines.join('\n'));
    document.title = 'done';
  } catch (e) {
    out('失败: ' + (e && e.stack ? e.stack.slice(0, 800) : e));
  }
})();
</script>
</body>
</html>
