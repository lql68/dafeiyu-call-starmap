<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大肥鱼 黑块溯源 v6（窗口差分）</title>
<style>html,body{margin:0;background:#0b1220;color:#cfe6f5;font:12px/1.4 ui-monospace,monospace}
#c{position:absolute;left:-3000px}#out{position:absolute;inset:0;padding:10px;white-space:pre}</style>
</head>
<body>
<div id="out">…</div><canvas id="c"></canvas>
<script src="lib/live2dcubismcore.min.js"></script>
<script src="lib/pixi.min.js"></script>
<script src="lib/cubism4.min.js"></script>
<script>
const out = s => { document.getElementById('out').textContent = s; };
window.onerror = (m, s, l) => out('JS 错误: ' + m + ' @' + l);
(async () => {
  try {
    const CW = 400, CH = 800;
    const app = new PIXI.Application({view: document.getElementById('c'), width: CW, height: CH,
      backgroundAlpha: 0, antialias: false, resolution: 1});
    const model = await PIXI.live2d.Live2DModel.from('model/大肥鱼/大肥鱼.model3.json', {autoInteract: false});
    app.stage.addChild(model);
    app.ticker.stop();

    const im = model.internalModel;
    const sc = CH / (im.originalHeight * 0.42);
    model.scale.set(sc);
    model.x = (CW - im.originalWidth * sc) / 2;
    model.y = 0;
    const mm = im.coreModel, mo = mm._model, d = mo.drawables, parts = mo.parts;
    const gl = app.renderer.gl;

    const frameWith = (mut) => { model.update(1 / 60); if (mut) mut(); app.renderer.render(app.stage); };
    const grab = () => { const b = new Uint8Array(CW * CH * 4); gl.readPixels(0, 0, CW, CH, gl.RGBA, gl.UNSIGNED_BYTE, b); return b; };

    for (let k = 0; k < 8; k++) frameWith();
    const base = grab();

    // 定窗口：找近黑且四周亮的点
    const L = (b, x, y) => (x < 0 || y < 0 || x >= CW || y >= CH) ? 0 :
      (0.299 * b[(y * CW + x) * 4] + 0.587 * b[(y * CW + x) * 4 + 1] + 0.114 * b[(y * CW + x) * 4 + 2]);
    let box = null;
    for (let y = Math.round(CH * 0.12); y < Math.round(CH * 0.50) && !box; y++) {
      for (let x = Math.round(CW * 0.30); x < Math.round(CW * 0.70); x++) {
        if (base[(y * CW + x) * 4 + 3] < 250) continue;
        if (L(base, x, y) > 50) continue;
        if ([L(base, x - 13, y), L(base, x + 13, y), L(base, x, y - 13), L(base, x, y + 13)].every(v => v > 160)) { box = {x, y}; break; }
      }
    }
    if (!box) { out('没找到黑块'); return; }

    const X0 = Math.max(0, box.x - 22), X1 = Math.min(CW - 1, box.x + 22);
    const Y0 = Math.max(0, box.y - 26), Y1 = Math.min(CH - 1, box.y + 26);
    const patchDiff = (b) => {
      let s = 0, n = 0;
      for (let y = Y0; y <= Y1; y++) for (let x = X0; x <= X1; x++) {
        const i = (y * CW + x) * 4;
        s += Math.abs(b[i] - base[i]) + Math.abs(b[i + 1] - base[i + 1]) + Math.abs(b[i + 2] - base[i + 2]);
        n++;
      }
      return s / n;
    };

    const rows = [];
    for (let i = 0; i < mm.getDrawableCount(); i++) {
      frameWith(() => { d.opacities[i] = 0; });
      const dd = patchDiff(grab());
      if (dd > 0.2) rows.push({i, dd: +dd.toFixed(2)});
    }
    frameWith();
    rows.sort((a, b) => b.dd - a.dd);
    const lines = ['黑块 @' + box.x + ',' + box.y + '  窗口 ' + (X1 - X0 + 1) + 'x' + (Y1 - Y0 + 1) + '  命中 ' + rows.length];
    for (const r of rows.slice(0, 12)) {
      const pp = d.parentPartIndices[r.i];
      lines.push('#' + r.i + ' ' + d.ids[r.i] + ' diff=' + r.dd + ' part=' + (pp >= 0 ? parts.ids[pp] : '-'));
    }
    out(lines.join('\n'));
    document.title = 'done';
  } catch (e) {
    out('失败: ' + (e && e.stack ? e.stack.slice(0, 800) : e));
  }
})();
</script>
</body>
</html>
